# Dependency Review Configuration
# Used by actions/dependency-review-action@v4

# Fail on high/critical vulnerabilities
fail-on-severity: high

# Allow specific vulnerabilities that are known and accepted
# Format: "CVE-ID: reason"
allow:
  # Example: "CVE-2023-1234: Fixed in upstream, waiting for release"

# Severity levels to check
severity:
  - critical
  - high

# Package ecosystems to check
ecosystems:
  - pypi

# Scope of review
scope:
  - runtime
  - development