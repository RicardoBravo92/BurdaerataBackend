name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # Settings requires these; CI is hermetic and never touches a real DB/Clerk.
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      CLERK_SECRET_KEY: sk_test_ci_dummy
      RESEND_API_KEY: re_test_ci_dummy
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run type checks (mypy)
        run: uv run mypy app --ignore-missing-imports || true

      - name: Run linting (ruff)
        run: uv run ruff check app tests

      - name: Run formatting check (ruff)
        run: uv run ruff format --check app tests

      - name: Run security audit (pip-audit)
        run: uv run pip-audit --desc || true

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing --ignore=tests/test_game.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: burdaerata-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
